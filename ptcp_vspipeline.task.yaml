name: VSPipeline PTCP Automate
description: Create a project and run the ptcp report
auto_generate_session_for_account: "{workspaceBot}"

agent_requirements:
  cpu_cores: 4
  memory_gb: 8

parameters:
  - name: base_path
    label: Input Folder
    help: The input folder of vcf.gz files to analyze
    type: directory

  - name: project_name
    label: Project Name
    value: VSProject
    type: string

  - name: project_template
    label: VarSeq Project Template
    type: file
    path: AppData/VarSeq/User Data/ProjectTemplates/
    value: AppData/VarSeq/User Data/ProjectTemplates/PacBio_PureTarget_GRCh38.vsproject-template

steps:
  - name: vspipeline
    description: Run vspipeline
    type: cmd
    docker:
      image: ${VSPIPELINE_DOCKER_IMAGE}
    args:
      - |-
        set -euo pipefail

        export GOLDENHELIX_USERDATA=${WORKSPACE_DIR}/AppData

        # Start with this one, but we need *.vcf and need to not get the f8, maybe index as part of secondary
        # Maybe add a 32GB RAM machine config, the large is too large

        # Output the number of detected files
        echo "Running VSPipeline on ${base_path}"
        cd "${base_path}"

        # Run VSPipeline: create a project, import the VCFs, download required sources, wait for tasks to complete, get the task list, and save the project
        rm -rf "${project_name}"

        if [ -d "$WORKSPACE_DIR/AppData/VarSeq/User Data" ]; then
          export GH_CRASH_DUMP_DIR="$WORKSPACE_DIR/AppData/VarSeq/User Data"
        fi
        if [ -d "/scratch" ]; then
          export GH_TEMPDIR="/scratch"
        fi

        vcf_files=$(find . \( -name "*.trgt.vcf" -o -name "*.vcf.gz" \) -type f | paste -sd ',' - | sed 's/\([^,]*\)/"\1"/g')

        # Find all *.mapped.bam files and upsert them to the SampleManifest catalog
        find . -name "*.mapped.bam" -type f | while read -r bam_file; do
          # Convert to absolute path
          abs_path="$(realpath "$bam_file")"
          # Remove $WORKSPACE_DIR/ prefix if present
          rel_path="${abs_path#${WORKSPACE_DIR}/}"
          # Extract sample name (remove .mapped.bam extension)
          sample_name="$(basename "$bam_file" .mapped.bam)"
          gautil client catalog-upsert SampleCatalog Sample="$sample_name" BAMPath="$rel_path" Affected="Affected"
        done

        # Write the commands to create-project.vs-batch using a heredoc
        cat <<EOF > create-project.vs-batch
        get_version
        project_create "${project_name}" "$project_template"
        import files="${vcf_files}" append_files_with_same_samples=True sample_fields_catalog=SampleCatalog
        download_required_sources
        task_wait
        foreach_sample "table_recordset_add_current SmallVariants VA"
        foreach_sample "table_recordset_add_current STRs TR"
        run_project_report PacBio_PureTarget_Report true true '[{ "name":"Variant Record Set", "value": "VA" }, { "name":"Str Record Set", "value": "TR" }, { "name":"Output Directory", "value": "$base_path" }, { "name":"Supporting Files", "value": "$base_path" }]'
        get_task_list
        project_close
        EOF

        /opt/vspipeline/vspipeline \
            -c batch file=create-project.vs-batch

        rm -f create-project.vs-batch
